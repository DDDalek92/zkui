<#import "layouts/main-layout.ftl.html" as main>
<@main.page>
<div class="container">
    <div class="row-fluid">
        <div class="col-md-12 text-center">
            <h3>Search Results</h3>
        </div>
    </div>
    <div class="row-fluid">
        <div class="col-md-12 text-center">


            <table class="table table-striped table-bordered wrap-table" data-sortable="true">
                <thead>
                    <tr>
                        <th aria-sort="none"><button type="button" class="sort-column" data-sort-column="0" aria-label="Path">Path</button></th>
                        <th aria-sort="none"><button type="button" class="sort-column" data-sort-column="1" aria-label="Name">Name</button></th>
                        <th aria-sort="none"><button type="button" class="sort-column" data-sort-column="2" aria-label="Value">Value</button></th>
                    </tr>
                </thead>
                <tbody>
                    <#list searchResult as leaf>
                    <tr>
                        <td>
                            <a href="${contextPath?html}/home?zkPath=${leaf.path?url('UTF-8')?html}">${leaf.path?html}</a>
                        </td>
                        <td>${leaf.name?html}</td>
                        <td><span class="mono-pre-wrap">${leaf.strValue?html}</span></td>
                    </tr>
                    </#list>
                </tbody>
            </table>

        </div>
    </div>
</div>
</@main.page>
