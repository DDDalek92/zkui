name: Java 17 maintenance baseline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            distribution: temurin
          - os: windows-2022
            distribution: temurin
          - os: macos-14
            distribution: temurin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: ${{ matrix.distribution }}
          java-version: '17'
          cache: maven
      - name: Record toolchain
        run: |
          java -version
          ./mvnw --version
      - name: Build, unit tests and isolated integration tests
        shell: bash
        run: |
          set -o pipefail
          ./mvnw -B -ntp clean verify 2>&1 | tee "$RUNNER_TEMP/maven-build.log"
      - name: Browser sorting checks against rendered JAR pages
        if: runner.os == 'Linux'
        env:
          ZKUI_BROWSER_CHANNEL: chrome
        run: |
          npm ci --ignore-scripts
          npm test
      - name: Save test reports and build log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: java17-baseline-reports-${{ runner.os }}
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            ${{ runner.temp }}/maven-build.log
          retention-days: 14

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Build local image and check non-root runtime
        run: |
          docker build -f docker/Dockerfile -t zkui:ci .
          test "$(docker image inspect -f '{{.Config.User}}' zkui:ci)" = '10001:10001'
      - name: Check container login and context assets with synthetic credentials
        run: |
          trap 'docker logs zkui-ci; docker rm -fv zkui-ci' EXIT
          docker run -d --name zkui-ci -p 127.0.0.1:19090:9090 \
            -e ZK_SERVER=127.0.0.1:1 -e ZKUI_BASEURL=/container/ \
            -e LOGIN_MESSAGE='Container smoke' \
            -e USER_SET='{"users":[{"username":"container-test","password":"synthetic-container-only","role":"ADMIN"}]}' zkui:ci
          python3 src/test/docker/smoke.py

  mysql:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build owned MySQL migration helpers
        run: ./mvnw -B -ntp -DskipTests verify
      - name: Genuine old MySQL export to modern verified-TLS application
        env:
          ZKUI_OWNED_MYSQL_FIXTURE: 'true'
        shell: bash
        run: |
          set -euo pipefail
          tls="$RUNNER_TEMP/zkui-ci-tls"
          mkdir "$tls"
          openssl req -x509 -newkey rsa:2048 -nodes -keyout "$tls/ca.key" -out "$tls/ca.crt" -days 2 -subj /CN=zkui-ci-test-ca
          openssl req -newkey rsa:2048 -nodes -keyout "$tls/server.key" -out "$tls/server.csr" -subj /CN=localhost -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1'
          openssl x509 -req -in "$tls/server.csr" -CA "$tls/ca.crt" -CAkey "$tls/ca.key" -CAcreateserial -out "$tls/server.crt" -days 2 -copy_extensions copy
          chmod 755 "$tls"
          chmod 644 "$tls"/*
          keytool -importcert -noprompt -alias ci-ca -file "$tls/ca.crt" -keystore "$tls/trust.p12" -storetype PKCS12 -storepass synthetic-trust-only
          trap 'docker logs zkui-mysql56 || true; docker logs zkui-mysql84 || true; docker rm -fv zkui-mysql56 zkui-mysql84 || true' EXIT
          docker run -d --name zkui-mysql56 -p 127.0.0.1:13306:3306 -e MYSQL_ROOT_PASSWORD=synthetic-mysql-ci-only -e MYSQL_ROOT_HOST=% -e MYSQL_DATABASE=zkui_fixture mysql:5.6.51@sha256:20575ecebe6216036d25dab5903808211f1e9ba63dc7825ac20cb975e34cfcae --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --sql-mode=NO_ENGINE_SUBSTITUTION --skip-ssl
          docker run -d --name zkui-mysql84 -p 127.0.0.1:13307:3306 -e MYSQL_ROOT_PASSWORD=synthetic-mysql-ci-only -e MYSQL_ROOT_HOST=% -v "$tls:/ci-tls:ro" mysql:8.4@sha256:24989179f58856db763f418010c1169fecc944e3ec1ea7e921572d83eb070f70 --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-time-zone=+00:00 --ssl-ca=/ci-tls/ca.crt --ssl-cert=/ci-tls/server.crt --ssl-key=/ci-tls/server.key --require-secure-transport=ON
          for name in zkui-mysql56 zkui-mysql84; do
            ready=false
            for attempt in $(seq 1 120); do
              if docker exec "$name" mysqladmin -h127.0.0.1 -uroot -psynthetic-mysql-ci-only ping --silent; then ready=true; break; fi
              sleep 1
            done
            test "$ready" = true
          done
          docker image inspect -f '{{index .RepoDigests 0}}' mysql:5.6.51@sha256:20575ecebe6216036d25dab5903808211f1e9ba63dc7825ac20cb975e34cfcae mysql:8.4@sha256:24989179f58856db763f418010c1169fecc944e3ec1ea7e921572d83eb070f70 | tee target/mysql-image-digests.txt
          java -Duser.timezone=UTC -cp target/test-classes:target/classes:target/migration-drivers/mysql-old.jar:target/migration-drivers/flyway-old.jar com.deem.zkui.test.MySqlMigrationSmoke seed
          docker exec zkui-mysql56 mysqldump -uroot -psynthetic-mysql-ci-only --default-character-set=utf8mb4 --set-gtid-purged=OFF --databases zkui_fixture > target/mysql-synthetic-export.sql
          docker exec -i zkui-mysql84 mysql -uroot -psynthetic-mysql-ci-only < target/mysql-synthetic-export.sql
          docker exec zkui-mysql84 mysql -uroot -psynthetic-mysql-ci-only -e 'CREATE DATABASE zkui_fresh CHARACTER SET utf8mb4; CREATE DATABASE zkui_unknown CHARACTER SET utf8mb4; CREATE DATABASE zkui_future CHARACTER SET utf8mb4; CREATE DATABASE zkui_drift CHARACTER SET utf8mb4; CREATE DATABASE zkui_app_bridge CHARACTER SET utf8mb4'
          java -Duser.timezone=UTC -Djavax.net.ssl.trustStore="$tls/trust.p12" -Djavax.net.ssl.trustStorePassword=synthetic-trust-only -cp target/test-classes:target/zkui-2.0-SNAPSHOT-jar-with-dependencies.jar com.deem.zkui.test.MySqlMigrationSmoke unbridged
          # Independent copies only: never bridge the sealed original fixture or application database.
          docker exec zkui-mysql56 mysql -uroot -psynthetic-mysql-ci-only -e 'CREATE DATABASE zkui_bridge CHARACTER SET utf8mb4; CREATE DATABASE zkui_bridge_bad CHARACTER SET utf8mb4'
          docker exec zkui-mysql56 mysqldump -uroot -psynthetic-mysql-ci-only --default-character-set=utf8mb4 --set-gtid-purged=OFF zkui_fixture > target/mysql-bridge-copy.sql
          for copy in zkui_bridge zkui_bridge_bad; do
            docker exec -i zkui-mysql56 mysql -uroot -psynthetic-mysql-ci-only "$copy" < target/mysql-bridge-copy.sql
          done
          java -Duser.timezone=UTC -cp target/test-classes:target/classes:target/migration-drivers/mysql-old.jar:target/migration-drivers/flyway-old.jar:target/migration-drivers/flyway-bridge.jar com.deem.zkui.test.MySqlFlywayBridgeSmoke bridge
          docker exec zkui-mysql56 mysqldump -uroot -psynthetic-mysql-ci-only --default-character-set=utf8mb4 --set-gtid-purged=OFF --databases zkui_bridge > target/mysql-bridged-export.sql
          docker exec -i zkui-mysql84 mysql -uroot -psynthetic-mysql-ci-only < target/mysql-bridged-export.sql
          docker exec zkui-mysql56 mysqldump -uroot -psynthetic-mysql-ci-only --default-character-set=utf8mb4 --set-gtid-purged=OFF zkui_bridge > target/mysql-app-bridge-export.sql
          docker exec -i zkui-mysql84 mysql -uroot -psynthetic-mysql-ci-only zkui_app_bridge < target/mysql-app-bridge-export.sql
          docker exec zkui-mysql84 mysql -uroot -psynthetic-mysql-ci-only -e 'CREATE DATABASE zkui_modern_fresh CHARACTER SET utf8mb4'
          java -Duser.timezone=UTC -Djavax.net.ssl.trustStore="$tls/trust.p12" -Djavax.net.ssl.trustStorePassword=synthetic-trust-only -cp target/test-classes:target/classes:target/zkui-2.0-SNAPSHOT-jar-with-dependencies.jar com.deem.zkui.test.MySqlFlywayBridgeSmoke modern
          java -Duser.timezone=UTC -Djavax.net.ssl.trustStore="$tls/trust.p12" -Djavax.net.ssl.trustStorePassword=synthetic-trust-only -cp target/test-classes:target/zkui-2.0-SNAPSHOT-jar-with-dependencies.jar com.deem.zkui.test.MySqlMigrationSmoke verify
          # Separately cover a database created with the earlier MySQL-specific V1/Flyway2 path.
          docker exec zkui-mysql56 mysql -uroot -psynthetic-mysql-ci-only -e 'CREATE DATABASE zkui_dialect_source CHARACTER SET utf8mb4; CREATE DATABASE zkui_dialect_copy CHARACTER SET utf8mb4; CREATE DATABASE zkui_dialect_bad CHARACTER SET utf8mb4'
          java -Duser.timezone=UTC -cp target/test-classes:target/classes:target/migration-drivers/mysql-old.jar:target/migration-drivers/flyway-old.jar com.deem.zkui.test.MySqlDialectHistorySmoke seed
          docker exec zkui-mysql56 mysqldump -uroot -psynthetic-mysql-ci-only --default-character-set=utf8mb4 --set-gtid-purged=OFF zkui_dialect_source > target/mysql-dialect-source-tables.sql
          for copy in zkui_dialect_copy zkui_dialect_bad; do
            docker exec -i zkui-mysql56 mysql -uroot -psynthetic-mysql-ci-only "$copy" < target/mysql-dialect-source-tables.sql
          done
          docker exec zkui-mysql56 mysqldump -uroot -psynthetic-mysql-ci-only --default-character-set=utf8mb4 --set-gtid-purged=OFF --databases zkui_dialect_source > target/mysql-dialect-original-export.sql
          docker exec -i zkui-mysql84 mysql -uroot -psynthetic-mysql-ci-only < target/mysql-dialect-original-export.sql
          java -Duser.timezone=UTC -cp target/test-classes:target/classes:target/migration-drivers/mysql-old.jar:target/migration-drivers/flyway-old.jar:target/migration-drivers/flyway-bridge.jar com.deem.zkui.test.MySqlDialectHistorySmoke bridge
          docker exec zkui-mysql56 mysqldump -uroot -psynthetic-mysql-ci-only --default-character-set=utf8mb4 --set-gtid-purged=OFF --databases zkui_dialect_copy > target/mysql-dialect-bridged-export.sql
          docker exec -i zkui-mysql84 mysql -uroot -psynthetic-mysql-ci-only < target/mysql-dialect-bridged-export.sql
          java -Duser.timezone=UTC -Djavax.net.ssl.trustStore="$tls/trust.p12" -Djavax.net.ssl.trustStorePassword=synthetic-trust-only -cp target/test-classes:target/zkui-2.0-SNAPSHOT-jar-with-dependencies.jar com.deem.zkui.test.MySqlDialectHistorySmoke verify
          ./mvnw -B -ntp org.apache.maven.plugins:maven-dependency-plugin:3.8.1:tree -Dscope=runtime -DoutputFile=target/mysql-runtime-dependencies.txt
          cat target/mysql-runtime-dependencies.txt
      - name: Save synthetic migration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mysql-migration-evidence
          path: |
            target/mysql-image-digests.txt
            target/mysql-original-snapshot.txt
            target/mysql-runtime-dependencies.txt
            target/mysql-flyway-bridge-snapshot.txt
            target/mysql-bridge-app-snapshot.txt
            target/mysql-dialect-original-snapshot.txt
            target/mysql-dialect-bridged-snapshot.txt
          retention-days: 14

  zk-legacy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build client compatibility helper
        run: ./mvnw -B -ntp -DskipTests package
      - name: Current client against owned legacy server
        env:
          ZKUI_OWNED_ZK_FIXTURE: 'true'
        run: |
          set -euo pipefail
          trap 'docker logs zkui-legacy-zk || true; docker rm -fv zkui-legacy-zk || true' EXIT
          docker run -d --name zkui-legacy-zk -p 127.0.0.1:12181:2181 zookeeper:3.5.7@sha256:883b014b6535574503bda8fc6a7430ba009c0273242f86d401095689652e5731
          docker image inspect -f '{{index .RepoDigests 0}}' zookeeper:3.5.7@sha256:883b014b6535574503bda8fc6a7430ba009c0273242f86d401095689652e5731 | tee target/zk-legacy-digest.txt
          java -cp target/test-classes:target/zkui-2.0-SNAPSHOT-jar-with-dependencies.jar com.deem.zkui.test.ZkCompatibilitySmoke
          ./mvnw -B -ntp org.apache.maven.plugins:maven-dependency-plugin:3.8.1:tree -Dscope=runtime -DoutputFile=target/updated-runtime-dependencies.txt
          cat target/updated-runtime-dependencies.txt
      - name: Save client compatibility evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zk-client-compatibility
          path: |
            target/zk-legacy-digest.txt
            target/updated-runtime-dependencies.txt
          retention-days: 14
