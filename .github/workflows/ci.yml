name: Java 8 maintenance baseline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Record toolchain
        run: |
          java -version
          ./mvnw --version
      - name: Build, unit tests and isolated integration tests
        shell: bash
        run: |
          set -o pipefail
          ./mvnw -B -ntp clean verify 2>&1 | tee "$RUNNER_TEMP/maven-build.log"
      - name: Browser sorting checks against rendered JAR pages
        if: runner.os == 'Linux'
        env:
          ZKUI_BROWSER_CHANNEL: chrome
        run: |
          npm ci --ignore-scripts
          npm test
      - name: Save test reports and build log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: java8-baseline-reports-${{ runner.os }}
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            ${{ runner.temp }}/maven-build.log
          retention-days: 14

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build local image and check non-root runtime
        run: |
          docker build -f docker/Dockerfile -t zkui:ci .
          test "$(docker image inspect -f '{{.Config.User}}' zkui:ci)" = '10001:10001'
      - name: Check container login and context assets with synthetic credentials
        run: |
          trap 'docker logs zkui-ci; docker rm -fv zkui-ci' EXIT
          docker run -d --name zkui-ci -p 127.0.0.1:19090:9090 \
            -e ZK_SERVER=127.0.0.1:1 -e ZKUI_BASEURL=/container/ \
            -e LOGIN_MESSAGE='Container smoke' \
            -e USER_SET='{"users":[{"username":"container-test","password":"synthetic-container-only","role":"ADMIN"}]}' zkui:ci
          python3 src/test/docker/smoke.py
