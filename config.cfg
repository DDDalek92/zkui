#Server Port
serverPort=9090
#Comma seperated list of all the zookeeper servers
zkServer=localhost:2181,localhost:2181
#Http path of the repository. Ignore if you dont intent to upload files from repository.
scmRepo=http://myserver.com/@rev1=
#Remote imports are disabled by default. Operator-approved complete HTTP(S) URLs, separated by |.
remoteImportEnabled=false
remoteImportAllowedUrls=
#Path appended to the repo url. Ignore if you dont intent to upload files from repository.
scmRepoPath=//appconfig.txt
#If ldapAuth=true use LDAP; otherwise use userSet for web authentication.
ldapAuth=false
ldapDomain=mycompany,mydomain
#Optional LDAP DN template. Leave empty to preserve DOMAIN\username / supplied UPN behavior.
ldapUserDnPattern=
#JNDI connect/read timeout in milliseconds (1-30000), default 3000.
ldapConnectTimeout=3000
ldapReadTimeout=3000
#ldap authentication url. Ignore if using file based authentication.
ldapUrl=ldap://<ldap_host>:<ldap_port>/dc=mycom,dc=com
#Specific roles for ldap authenticated users. Ignore if using file based authentication.
ldapRoleSet={"users": [{ "username":"domain\\user1" , "role": "ADMIN" }]}
userSet = {"users": [{ "username":"admin" , "password":"manager","role": "ADMIN" },{ "username":"appconfig" , "password":"appconfig","role": "USER" }]}
#Use prod in production. H2 and MySQL never clean history automatically, even in dev.
env=prod
jdbcClass=org.h2.Driver
jdbcUrl=jdbc:h2:./zkui;MODE=LEGACY
jdbcUser=root
jdbcPwd=manager
#If you want to use mysql db to store history then comment the h2 db section.
#MySQL support baseline: 8.4 or newer; configure verified TLS and UTC for remote connections.
#jdbcClass=com.mysql.cj.jdbc.Driver
#jdbcUrl=jdbc:mysql://localhost:3306/zkui?sslMode=VERIFY_IDENTITY&serverTimezone=UTC&connectTimeout=5000&socketTimeout=5000
#jdbcUser=root
#jdbcPwd=manager
loginMessage=Please login using admin/manager or appconfig/appconfig.
#session timeout 5 mins/300 secs.
sessionTimeout=300
#Default 5 seconds to keep short lived zk sessions. If you have large data then the read will take more than 30 seconds so increase this accordingly. 
#A bigger zkSessionTimeout means the connection will be held longer and resource consumption will be high.
zkSessionTimeout=5
#Maximum initial ZooKeeper connection wait in seconds (1-60).
zkConnectTimeout=5
#REST requires a login session unless anonymous compatibility is explicitly enabled.
allowAnonymousRest=false
#Mask password fields over REST. Only an authenticated ADMIN may opt out.
#Anonymous and USER requests are always masked, even when this is false.
blockPwdOverRest=true
#ignore rest of the props below if https=false.
https=false
keystoreFile=/home/user/keystore.jks
keystorePwd=password
keystoreManagerPwd=password
#Optional ZooKeeper client identity, separate from web login and node ACLs.
zkAuthScheme=
zkAuthCredentials=
# The default ACL to use for all creation of nodes. If left blank, then all nodes will be universally accessible
# Permissions are based on single character flags: c (Create), r (read), w (write), d (delete), a (admin), * (all)
# For example defaultAcl={"acls": [{"scheme":"ip", "id":"192.168.1.192", "perms":"*"}, {"scheme":"ip", "id":"192.168.1.0/24", "perms":"r"}]}
#Digest ACL IDs require username:base64(SHA1(username:password)), not plaintext credentials.
#Use {"scheme":"auth","id":"","perms":"*"} for the configured authenticated creator identity.
defaultAcl=
# Set X-Forwarded-For to true if zkui is behind a proxy
X-Forwarded-For=false

# Application namespace (relative to any zkServer chroot); must already exist.
zkRootPath=/
# Optional REST host mapping location within that namespace. Default: /appconfig/hosts
# for root /, otherwise <zkRootPath>/hosts.
#zkHostsPath=/appconfig/hosts

# Maximum history records returned per query (1-1000, default 50).
historyLimit=50

# Public context path. Keep the same prefix at the reverse proxy; / is the default.
baseURL=/

# Client response buffer (1-16 MiB); large child lists are paged 100 names at a time.
zkMaxBufferBytes=8388608

# Optional startup hosts metadata bootstrap. Never deletes entries or changes existing ACLs.
initializeHosts=false
# Existing mapping values are preserved unless this second flag is explicitly enabled.
hostsBootstrapOverwrite=false
# JSON object: hostname -> exact existing REST mapping text. Only used when initializeHosts=true.
hostsBootstrapEntries={}
